name: Deploy to Hostinger

# Manual only, and deliberately so. This pushes to production; it should be an
# act, not a side effect of merging. Trigger it from the Actions tab
# ("Run workflow"), which also records who ran it and when.
on:
  workflow_dispatch:
    inputs:
      skip_smoke_test:
        description: 'Deploy without verifying the live site afterwards (not recommended)'
        type: boolean
        default: false

concurrency:
  # Never two deploys at once: the second would rsync over a half-written tree.
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build, upload, restart, verify
    runs-on: ubuntu-latest

    steps:
      # Named first, and before the eight minutes of build that would otherwise
      # precede the failure.
      #
      # ── Why this step exists ────────────────────────────────────────────
      # Without it a missing secret surfaces as `ssh-keyscan` exiting 1 under
      # `bash -e`, six steps in, with a log that prints the *step's env var
      # names* — SSH_HOST, SSH_PORT, SSH_PRIVATE_KEY — and nothing else. Those
      # are not the secret names. On 2026-08-20 that log was read exactly as it
      # reads, and three repository secrets were created called SSH_PRIVATE_KEY,
      # SSH_HOST and SH_PORT: two under the wrong name and one under a typo,
      # none of them visible to this workflow, and the next run failed
      # identically with no new information.
      #
      # A secret's value is never printed here — only whether it is empty.
      - name: Check the deploy secrets are set
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_PATH: ${{ secrets.HOSTINGER_PATH }}
          NEXT_PUBLIC_APP_DOMAIN: ${{ secrets.NEXT_PUBLIC_APP_DOMAIN }}
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
          # Optional ones, reported but never fatal.
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_RESTART_COMMAND: ${{ secrets.HOSTINGER_RESTART_COMMAND }}
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          missing=""
          # Required: the four that say how to reach the host — which cannot
          # live on the host — and the one baked value whose absence is not
          # survivable (every page would say `platform.com`).
          # Everything else the application needs is read at runtime from
          # Hostinger's own .env and has no business being duplicated here.
          for name in HOSTINGER_SSH_KEY HOSTINGER_HOST HOSTINGER_USER HOSTINGER_PATH \
                      NEXT_PUBLIC_APP_DOMAIN; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
              echo "::error::Repository secret $name is not set."
            fi
          done

          # Blank is a supported state for each of these, and each has a
          # consequence worth saying out loud rather than discovering later.
          #
          # Written as `if`, never as `[ -z "$X" ] && echo`. This job runs under
          # `bash -e`, where a `&&` whose left side is false is a failed command
          # and ends the script - so the short form would abort the preflight on
          # precisely the runs where these ARE set.
          # Warned about, never fatal. `AddressAutocomplete` degrades to the
          # plain field the form has always had, plus a line saying why there is
          # no search — which is what production does today, because the token is
          # not in `.env.local` either. Blocking a deploy over a feature that is
          # already off would be this check inventing a problem.
          if [ -z "$NEXT_PUBLIC_MAPBOX_TOKEN" ]; then
            echo "::warning::NEXT_PUBLIC_MAPBOX_TOKEN is blank - address autocomplete falls back to a plain text field. It is baked into the build, so the panel cannot switch it on afterwards."
          fi
          if [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::notice::NEXT_PUBLIC_SUPABASE_ANON_KEY is blank — currently harmless, because publicEnv.supabaseAnonKey is read by nothing. Sign-in uses the runtime value from Hostinger's .env."
          fi
          if [ -z "$SUPABASE_URL" ]; then
            echo "::notice::SUPABASE_URL is blank — harmless, it is only ever read at runtime from Hostinger's .env."
          fi
          if [ -z "$HOSTINGER_PORT" ]; then
            echo "::notice::HOSTINGER_PORT is blank — SSH will use port 22."
          fi
          if [ -z "$HOSTINGER_RESTART_COMMAND" ]; then
            echo "::warning::HOSTINGER_RESTART_COMMAND is blank — the upload will happen but the OLD process keeps serving until you restart in hPanel."
          fi
          if [ -z "$PRODUCTION_URL" ]; then
            echo "::warning::PRODUCTION_URL is blank — the smoke test cannot verify the deploy."
          fi

          if [ -n "$missing" ]; then
            echo ""
            echo "Add them at Settings -> Secrets and variables -> Actions -> New repository secret."
            echo "The names above are the SECRET names. They are deliberately not the"
            echo "same as the env var names printed inside a failing step — a secret"
            echo "called SSH_HOST or SSH_PRIVATE_KEY is invisible to this workflow."
            echo "DEPLOYMENT.md has what each one holds."
            echo ""
            echo "Note: most of this application's environment does NOT belong here."
            echo "DATABASE_URL, SMTP_*, SUPABASE_SERVICE_ROLE_KEY and the rest are read"
            echo "at runtime from Hostinger's .env and must stay there. Only the four"
            echo "connection secrets and NEXT_PUBLIC_APP_DOMAIN, which Next.js bakes in,"
            echo "have to be repository secrets."
            exit 1
          fi

          echo "All required deploy secrets are present."

      - name: Check out the repository
        uses: actions/checkout@v4

      # Ubuntu, matching the host. `sharp` ships platform-specific binaries, so
      # a Windows build produces an artifact that cannot run on Hostinger —
      # which is exactly why this job exists rather than a local `npm run build`
      # and a drag into an SFTP window.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── Which variables belong HERE, and which belong in Hostinger ─────
      #
      # Almost none of them belong here. The application reads its environment
      # at runtime through `serverEnv` / `requireServerEnv`, which are
      # `process.env[name]` — a dynamic lookup Next.js cannot inline. Every one
      # of those is read on the host, from the panel's .env, and setting it here
      # would achieve nothing. DATABASE_URL, SMTP_*, SUPABASE_SERVICE_ROLE_KEY
      # and the rest are all in that group.
      #
      # The exception is `lib/env.ts`'s `publicEnv`, which references
      # `process.env.NEXT_PUBLIC_X` as a **literal**. Next.js substitutes those
      # for their values while compiling, so they are frozen into the artifact
      # and the panel cannot change them afterwards. Two of them are actually
      # read:
      #
      #   NEXT_PUBLIC_APP_DOMAIN   `app/page.tsx` is prerendered, so this is
      #                            baked into the static homepage HTML. Left
      #                            unset the whole platform says `platform.com`.
      #   NEXT_PUBLIC_MAPBOX_TOKEN read by `AddressAutocomplete`, a client
      #                            component. Left unset, address autocomplete
      #                            is silently dead on every form.
      #
      # The other two are passed for safety rather than need — `SUPABASE_URL` is
      # only ever read dynamically, and `publicEnv.supabaseAnonKey` is currently
      # read by nothing — so the preflight warns about them and does not fail.
      - name: Build the standalone artifact
        env:
          NEXT_PUBLIC_APP_DOMAIN: ${{ secrets.NEXT_PUBLIC_APP_DOMAIN }}
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: npm run build

      # Next leaves these two out of `standalone`. Without them the server runs
      # and every stylesheet 404s, which reads as "the site is broken" rather
      # than "two directories are missing".
      - name: Assemble the deployable tree
        run: |
          cp -r .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -r public .next/standalone/public; fi
          echo "Artifact size: $(du -sh .next/standalone | cut -f1)"

      - name: Authorise the deploy key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pin the host key rather than disabling checking, so this cannot be
          # pointed at an impostor by anyone who can influence DNS.
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # --delete so a file removed from the repo also leaves the server, with
      # node_modules excluded: `standalone` carries only what it traced, and the
      # host must not accumulate a second, stale dependency tree.
      - name: Upload the artifact
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          DEPLOY_PATH: ${{ secrets.HOSTINGER_PATH }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy -p ${SSH_PORT:-22}" \
            .next/standalone/ \
            "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      # Also ships the diagnostics scripts, which are not part of `standalone`
      # and are wanted on the host precisely when something is wrong.
      - name: Upload the diagnostic scripts
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          DEPLOY_PATH: ${{ secrets.HOSTINGER_PATH }}
        run: |
          rsync -az \
            -e "ssh -i ~/.ssh/id_deploy -p ${SSH_PORT:-22}" \
            scripts/ \
            "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/scripts/"

      - name: Restart the application
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          RESTART_COMMAND: ${{ secrets.HOSTINGER_RESTART_COMMAND }}
        run: |
          if [ -z "$RESTART_COMMAND" ]; then
            echo "::warning::HOSTINGER_RESTART_COMMAND is not set — the new code is"
            echo "::warning::uploaded but the OLD process is still running. Restart in hPanel."
            exit 0
          fi
          ssh -i ~/.ssh/id_deploy -p "${SSH_PORT:-22}" \
            "$SSH_USER@$SSH_HOST" "$RESTART_COMMAND"

      # A restart is not instant and a smoke test against a half-started server
      # reports a failure that is not real.
      - name: Wait for the process to come back
        if: ${{ !inputs.skip_smoke_test }}
        run: sleep 20

      # The point of the whole workflow: a deploy that is not verified is a
      # deploy that reports success while the site is down.
      - name: Verify the live site
        if: ${{ !inputs.skip_smoke_test }}
        env:
          SMOKE_SUPER_ADMIN_EMAIL: ${{ secrets.SMOKE_SUPER_ADMIN_EMAIL }}
          SMOKE_SUPER_ADMIN_PASSWORD: ${{ secrets.SMOKE_SUPER_ADMIN_PASSWORD }}
        run: node scripts/smoke-test-live.mjs "${{ secrets.PRODUCTION_URL }}"

      - name: Remove the deploy key
        if: always()
        run: rm -f ~/.ssh/id_deploy
