name: Verify the live deployment

# ── This workflow does NOT deploy, and used to pretend it did ──────────────
#
# Hostinger builds this app from GitHub itself; hPanel shows the site connected
# directly to the repository with root directory `./`. There is no separate
# Node.js application root to upload into.
#
# Until 2026-08-21 this workflow built a standalone artifact and rsynced it over
# SSH, and reported success every time. It was never serving anything. Proven:
# run 32424514882 uploaded build `Iwrd9bUQ0XAqcQJcKVEWO`, and the host went on
# serving a different build while 404ing the route that build introduced. Four
# "successful deploys" had deployed nothing.
#
# The upload steps are gone rather than fixed, because there was nothing to fix:
# the deploy is Hostinger's, from hPanel's Git section. What was missing is any
# way to see whether it had happened, and that is what this workflow is now for.
#
#   * `generateBuildId` in next.config.mjs makes the build id the **commit sha**,
#     so the running commit is readable from any page and from
#     `GET /api/internal/build`.
#   * The cache is purged, because prerendered pages ship
#     `s-maxage=31536000` and otherwise serve the previous build for a year.
#   * The smoke test proves the site is actually up.
#
# Run it after deploying from hPanel.

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Commit sha that should be live (blank = whatever main points at)'
        type: string
        required: false

concurrency:
  group: verify-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Purge cache, confirm the commit, smoke test
    runs-on: ubuntu-latest

    steps:
      # Named first, so a missing secret costs one line of log rather than a
      # confusing failure further down. A secret's value is never printed —
      # only whether it is empty.
      - name: Check the secrets this workflow needs
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "::error::Repository secret PRODUCTION_URL is not set. Without it nothing here can run."
            exit 1
          fi

          # The site's domain is derived from PRODUCTION_URL rather than read
          # from a second secret. NEXT_PUBLIC_APP_DOMAIN belongs in Hostinger's
          # panel now that Hostinger runs the build, so depending on a GitHub
          # copy of it would break this workflow the moment that copy is
          # correctly deleted.
          if [ -z "$HOSTINGER_API_TOKEN" ] || [ -z "$HOSTINGER_USER" ]; then
            echo "::warning::HOSTINGER_API_TOKEN or HOSTINGER_USER is blank, so the cache will NOT be purged. Prerendered pages keep serving the previous build until you press Clear website cache in hPanel."
          fi

          echo "PRODUCTION_URL is set."

      - name: Check out the repository
        uses: actions/checkout@v4

      # ── Prerendered pages serve the OLD build for a year without this ────
      #
      # Static routes go out with `Cache-Control: s-maxage=31536000`. On
      # 2026-08-21 `/super-admin/login` was served **30.4 hours stale** and could
      # not be busted by `no-cache`, `no-store` or `Pragma` from the client. Its
      # markup then referenced chunk hashes the newer build no longer had, so
      # hydration died and the page showed a client-side exception.
      #
      # ── The endpoint, and how it was established ─────────────────────────
      #   DELETE /api/hosting/v1/accounts/{username}/websites/{domain}/cache/clear
      #
      # From Hostinger's own API SDKs, where it is `clear_website_cache_v1` on
      # `HostingCacheApi`. An earlier version of this step tried four candidate
      # paths with POST: three answered 404 and `cache/clear` answered **405
      # Method Not Allowed** — a path that exists, rejecting the verb. The path
      # was always right and the method was always wrong. It is DELETE.
      - name: Purge the website cache
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          if [ -z "$HOSTINGER_API_TOKEN" ] || [ -z "$HOSTINGER_USER" ]; then
            echo "Skipped — see the warning above."
            exit 0
          fi

          domain=$(printf '%s' "$PRODUCTION_URL" | sed -E 's#^https?://##' | cut -d/ -f1)
          url="https://developers.hostinger.com/api/hosting/v1/accounts/$HOSTINGER_USER/websites/$domain/cache/clear"

          # Measured before and after, so this proves the cache actually moved
          # rather than trusting a 2xx. `Age` is how many seconds the edge has
          # been holding the copy it just served; clearing resets it.
          age_before=$(curl -s -D - -o /dev/null --max-time 25 "$PRODUCTION_URL/super-admin/login" \
                       | grep -i '^age:' | tr -d '\r' | awk '{print $2}')
          echo "Age before: ${age_before:-<none>}s"

          code=$(curl -s -o /tmp/purge.out -w '%{http_code}' --max-time 30 \
                 -X DELETE "$url" \
                 -H "Authorization: Bearer $HOSTINGER_API_TOKEN" \
                 -H 'Content-Type: application/json' \
                 -H 'Accept: application/json' || echo 000)

          case "$code" in
            2*)
              echo "Cache cleared (HTTP $code)."
              ;;
            401|403)
              # Print what the API itself said. "Unauthenticated" and
              # "insufficient scope" are different problems with the same status
              # and only the body distinguishes them. The token is never echoed;
              # this is the response, not the request.
              echo "::error::HTTP $code — Hostinger rejected the token."
              echo "The API replied:"
              head -c 400 /tmp/purge.out || true
              echo ""
              echo ""
              echo "Check, in this order:"
              echo "  1. The token is a Hostinger API token from hPanel -> API,"
              echo "     not a VPS-only token and not the GHL token."
              echo "  2. It was pasted without surrounding quotes or trailing"
              echo "     whitespace. GitHub stores exactly what was pasted."
              echo "  3. It has not expired, and its scope covers Hosting."
              echo ""
              echo "Test the same token locally to separate a bad token from a"
              echo "bad secret — this should return 200 and a JSON list:"
              echo "  curl -i -H \"Authorization: Bearer \$TOKEN\" \\"
              echo "    https://developers.hostinger.com/api/hosting/v1/accounts"
              exit 1
              ;;
            404)
              echo "::error::HTTP 404 — no website '$domain' under account '$HOSTINGER_USER'. Check HOSTINGER_USER, and that PRODUCTION_URL names the site as Hostinger knows it."
              exit 1
              ;;
            405)
              echo "::error::HTTP 405 — the API no longer accepts DELETE here. Re-check the method in Hostinger's API reference."
              exit 1
              ;;
            *)
              echo "::error::HTTP $code from the cache API."
              head -c 400 /tmp/purge.out || true
              exit 1
              ;;
          esac

          # Give the edge a moment to drop what it was holding.
          sleep 5

          age_after=$(curl -s -D - -o /dev/null --max-time 25 "$PRODUCTION_URL/super-admin/login" \
                      | grep -i '^age:' | tr -d '\r' | awk '{print $2}')
          echo "Age after:  ${age_after:-<none>}s"

          # A cleared cache serves a fresh copy, so Age comes back absent or
          # small. Still hours old means the API returned success and changed
          # nothing — the exact failure this step exists to stop being silent.
          if [ -n "$age_before" ] && [ -n "$age_after" ] && [ "$age_after" -ge "$age_before" ]; then
            echo "::error::The API reported success but the edge is still serving a ${age_after}s-old copy. The purge did not take effect."
            exit 1
          fi

          echo "Verified: the edge is serving a fresh copy."

      # ── Which commit is actually serving requests ────────────────────────
      #
      # `generateBuildId` makes the build id the commit sha, so this is an exact
      # answer rather than the random string Next would otherwise produce. Read
      # from a route handler, which cannot be prerendered or cached — the check
      # this replaces read a CDN-cached page and was therefore meaningless.
      # Runs even when the purge failed, and that is the point.
      #
      # On 2026-08-22 the purge died on a 401 from Hostinger's API — an expired
      # token, nothing to do with the deployment — and this step was skipped.
      # So the run reported "failure" without ever answering the question the
      # whole workflow exists to answer, and the one number a person actually
      # wanted was the one thing missing from the log.
      #
      # The two are independent: which commit is serving requests is read from
      # `/api/internal/build`, a route handler that is never cached and never
      # touches the purge. A stale edge cannot make this answer wrong, only the
      # prerendered pages around it. So it reports regardless, and the job still
      # fails overall because the purge's own step already failed.
      - name: Confirm which commit is live
        if: ${{ !cancelled() }}
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          EXPECTED: ${{ inputs.expected_sha }}
        run: |
          expected="$EXPECTED"
          if [ -z "$expected" ]; then expected=$(git rev-parse HEAD); fi
          expected=$(printf '%s' "$expected" | cut -c1-12)

          # A trailing slash on the secret makes this `…//api/internal/build`,
          # which the host answers with a 308. `curl` without `-L` does not
          # follow it, so the body came back empty and the branch below then
          # announced a stale deploy that had in fact shipped — on 2026-08-23,
          # against a site that was serving the expected commit at that moment.
          # This workflow exists to stop exactly that claim being made, so it
          # must not be the thing making it. Normalise, and follow redirects.
          base="${PRODUCTION_URL%/}"

          status=$(curl -sSL --max-time 25 -o /tmp/build.json -w '%{http_code}' \
            "$base/api/internal/build" 2>/dev/null || echo "000")
          body=$(cat /tmp/build.json 2>/dev/null || true)
          live=$(printf '%s' "$body" | sed -n 's/.*"buildId":"\([^"]*\)".*/\1/p')

          echo "url:      $base/api/internal/build"
          echo "status:   $status"
          echo "expected: $expected"
          echo "live:     ${live:-<no answer>}"

          if [ "$live" = "$expected" ]; then
            echo "The live site is running $expected."
            exit 0
          fi

          if [ -z "$live" ]; then
            # Report what happened; do not infer a cause from an absent answer.
            # "The running build predates that route" was asserted here
            # unconditionally, and it is only one of several explanations — a
            # wrong PRODUCTION_URL, a redirect, a timeout and an outage all look
            # identical from here, and three of them are not about the deploy.
            echo "::error::/api/internal/build did not answer (HTTP $status). Check PRODUCTION_URL is the site's origin with no trailing path, that the site is up, and — if the status is 000 — that the request left the runner at all. A build older than 2026-08-21 would also 404 here, but that is not the only cause."
          else
            echo "::error::The live site is running $live, not $expected."
          fi
          echo ""
          echo "This workflow does not deploy — Hostinger does, from its GitHub"
          echo "connection. Deploy from hPanel's Git section, then run this again."
          echo ""
          echo "Anyone can check the live commit at any time with:"
          echo "  curl -s \$PRODUCTION_URL/api/internal/build"
          exit 1

      # The point of the whole thing: a deploy nobody verified is a deploy that
      # reports success over a broken site.
      - name: Smoke test the live site
        if: ${{ !cancelled() }}
        env:
          SMOKE_SUPER_ADMIN_EMAIL: ${{ secrets.SMOKE_SUPER_ADMIN_EMAIL }}
          SMOKE_SUPER_ADMIN_PASSWORD: ${{ secrets.SMOKE_SUPER_ADMIN_PASSWORD }}
        run: node scripts/smoke-test-live.mjs "${{ secrets.PRODUCTION_URL }}"
