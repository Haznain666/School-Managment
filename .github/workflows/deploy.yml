name: Verify the live deployment

# ── This workflow does NOT deploy, and used to pretend it did ──────────────
#
# Hostinger builds this app from GitHub itself; hPanel shows the site connected
# directly to the repository with root directory `./`. There is no separate
# Node.js application root to upload into.
#
# Until 2026-08-21 this workflow built a standalone artifact and rsynced it over
# SSH, and reported success every time. It was never serving anything. Proven:
# run 32424514882 uploaded build `Iwrd9bUQ0XAqcQJcKVEWO`, and the host went on
# serving a different build while 404ing the route that build introduced. Four
# "successful deploys" had deployed nothing.
#
# The upload steps are gone rather than fixed, because there was nothing to fix:
# the deploy is Hostinger's, from hPanel's Git section. What was missing is any
# way to see whether it had happened, and that is what this workflow is now for.
#
#   * `generateBuildId` in next.config.mjs makes the build id the **commit sha**,
#     so the running commit is readable from any page and from
#     `GET /api/internal/build`.
#   * The cache is purged, because prerendered pages ship
#     `s-maxage=31536000` and otherwise serve the previous build for a year.
#   * The smoke test proves the site is actually up.
#
# Run it after deploying from hPanel.

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Commit sha that should be live (blank = whatever main points at)'
        type: string
        required: false

concurrency:
  group: verify-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Purge cache, confirm the commit, smoke test
    runs-on: ubuntu-latest

    steps:
      # Named first, so a missing secret costs one line of log rather than a
      # confusing failure further down. A secret's value is never printed —
      # only whether it is empty.
      - name: Check the secrets this workflow needs
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          NEXT_PUBLIC_APP_DOMAIN: ${{ secrets.NEXT_PUBLIC_APP_DOMAIN }}
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "::error::Repository secret PRODUCTION_URL is not set. Without it nothing here can run."
            exit 1
          fi

          if [ -z "$HOSTINGER_API_TOKEN" ] || [ -z "$HOSTINGER_USER" ] || [ -z "$NEXT_PUBLIC_APP_DOMAIN" ]; then
            echo "::warning::HOSTINGER_API_TOKEN, HOSTINGER_USER or NEXT_PUBLIC_APP_DOMAIN is blank, so the cache will NOT be purged. Prerendered pages keep serving the previous build until you press Clear website cache in hPanel."
          fi

          echo "PRODUCTION_URL is set."

      - name: Check out the repository
        uses: actions/checkout@v4

      # ── Prerendered pages serve the OLD build for a year without this ────
      #
      # Static routes go out with `Cache-Control: s-maxage=31536000`. On
      # 2026-08-21 `/super-admin/login` was served **30.4 hours stale** and could
      # not be busted by `no-cache`, `no-store` or `Pragma` from the client. Its
      # markup then referenced chunk hashes the newer build no longer had, so
      # hydration died and the page showed a client-side exception.
      - name: Purge the website cache
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          NEXT_PUBLIC_APP_DOMAIN: ${{ secrets.NEXT_PUBLIC_APP_DOMAIN }}
        run: |
          if [ -z "$HOSTINGER_API_TOKEN" ] || [ -z "$HOSTINGER_USER" ] || [ -z "$NEXT_PUBLIC_APP_DOMAIN" ]; then
            echo "Skipped — see the warning above."
            exit 0
          fi

          base="https://developers.hostinger.com/api/hosting/v1/accounts/$HOSTINGER_USER/websites/$NEXT_PUBLIC_APP_DOMAIN"

          # The exact suffix is not documented in this repo. Guessing one and
          # swallowing the failure is how a step comes to do nothing quietly, so
          # each candidate is tried and every status printed: one run names the
          # real one, and none of them can fail silently.
          purged=0
          for path in "cache" "clear-cache" "cache/clear" "cache/purge"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
                   -X POST "$base/$path" \
                   -H "Authorization: Bearer $HOSTINGER_API_TOKEN" \
                   -H "Content-Type: application/json" \
                   -H "Accept: application/json" || echo 000)
            echo "  POST .../$path -> $code"
            case "$code" in
              2*) echo "Cache purged via .../$path"; purged=1; break ;;
            esac
          done

          if [ "$purged" -ne 1 ]; then
            echo "::error::Every cache-purge endpoint was refused. 404 means the path is wrong; 401/403 means the token or username is. Until this works, clear the cache in hPanel after each deploy."
            exit 1
          fi

      # ── Which commit is actually serving requests ────────────────────────
      #
      # `generateBuildId` makes the build id the commit sha, so this is an exact
      # answer rather than the random string Next would otherwise produce. Read
      # from a route handler, which cannot be prerendered or cached — the check
      # this replaces read a CDN-cached page and was therefore meaningless.
      - name: Confirm which commit is live
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          EXPECTED: ${{ inputs.expected_sha }}
        run: |
          expected="$EXPECTED"
          if [ -z "$expected" ]; then expected=$(git rev-parse HEAD); fi
          expected=$(printf '%s' "$expected" | cut -c1-12)

          body=$(curl -fsS --max-time 25 "$PRODUCTION_URL/api/internal/build" 2>/dev/null || true)
          live=$(printf '%s' "$body" | sed -n 's/.*"buildId":"\([^"]*\)".*/\1/p')

          echo "expected: $expected"
          echo "live:     ${live:-<no answer>}"

          if [ "$live" = "$expected" ]; then
            echo "The live site is running $expected."
            exit 0
          fi

          if [ -z "$live" ]; then
            echo "::error::/api/internal/build did not answer. The running build predates that route, so Hostinger has not deployed a commit from 2026-08-21 or later."
          else
            echo "::error::The live site is running $live, not $expected."
          fi
          echo ""
          echo "This workflow does not deploy — Hostinger does, from its GitHub"
          echo "connection. Deploy from hPanel's Git section, then run this again."
          echo ""
          echo "Anyone can check the live commit at any time with:"
          echo "  curl -s \$PRODUCTION_URL/api/internal/build"
          exit 1

      # The point of the whole thing: a deploy nobody verified is a deploy that
      # reports success over a broken site.
      - name: Smoke test the live site
        if: ${{ !cancelled() }}
        env:
          SMOKE_SUPER_ADMIN_EMAIL: ${{ secrets.SMOKE_SUPER_ADMIN_EMAIL }}
          SMOKE_SUPER_ADMIN_PASSWORD: ${{ secrets.SMOKE_SUPER_ADMIN_PASSWORD }}
        run: node scripts/smoke-test-live.mjs "${{ secrets.PRODUCTION_URL }}"
