name: CI

# Runs on every pull request and every push, so a PR branch gets two runs per
# push. The concurrency group below does not collapse that pair — the two
# events carry different refs (refs/heads/<branch> against refs/pull/<n>/merge)
# and so land in separate groups. What it does do is cancel the still-running
# check of a commit that a newer push has already superseded, on the same ref.
#
# To get a single run per PR push instead, narrow `push` to `branches: [main]`.
on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # package.json pins `engines.node: >=22`. CI was still on 20, which meant
      # the version that had to pass here was not the version the app declares
      # it runs on.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly what
      # package-lock.json specifies and fails if the two have drifted apart,
      # so CI cannot quietly pass against a different dependency tree than the
      # one committed.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Lint runs even when the typecheck failed. The two find unrelated
      # problems, and reporting both in one run saves a round trip.
      - name: Lint
        if: '!cancelled()'
        run: npm run lint

      # The protocol checks. Each one asserts a rule that is true today and
      # would otherwise quietly stop being true — a loader on every
      # data-fetching route, the form conventions, one component per address
      # and phone field, legible derived colours on every palette, and the
      # calendar/period/colour rules this sprint added.
      #
      # Only the ones that need no database are here. `check-dashboard`,
      # `check-portals`, `check-reports` and `check-provisioning` execute
      # against the real schema and belong on a machine that holds the
      # credentials, not in a workflow fork PRs can trigger.
      - name: Loaders — every data-fetching route has one
        if: '!cancelled()'
        run: npm run check-loaders

      - name: Forms
        if: '!cancelled()'
        run: npm run check-forms

      - name: Address and phone fields
        if: '!cancelled()'
        run: npm run check-address-phone

      - name: Theme contrast
        if: '!cancelled()'
        run: npm run check-theme

      # Calendar date arithmetic, subject-colour legibility, the period-schedule
      # time rules and the fee gate's generated copy. All four are invisible to
      # the type-checker and to a passing build: a month grid computed in the
      # wrong timezone, a subject colour whose lettering cannot be read, and a
      # welcome email that names a family's children are each correct-looking
      # code that is wrong on somebody else's screen.
      - name: Period schedules, calendar and colours
        if: '!cancelled()'
        run: npm run check-sprint-periods

      # Build last: it repeats type checking internally, so running it after a
      # failed typecheck would only echo errors already reported above.
      #
      # No secrets are needed. Every route that reads data is `force-dynamic`
      # and the postgres client is created lazily on first query, so nothing
      # here reaches for DATABASE_URL at build time. Adding real credentials
      # would be strictly worse: it would expose them to fork PRs for no
      # benefit.
      - name: Build
        run: npm run build
